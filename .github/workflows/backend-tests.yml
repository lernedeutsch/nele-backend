name: Nele backend tests
# CI sync trigger

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  unit:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile production code
        run: python -m compileall -q brain memory server speech tests

      - name: Validate Nele learning content
        run: python -m brain.logic.content_validation

      - name: Run backend tests
        run: python -m unittest discover -s tests -p "test_*.py"

  live-nele:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install requests
        run: pip install requests
      - name: Live Nele smoke test
        id: live_conversation
        continue-on-error: true
        run: |
          python test_nele_live.py > nele-live.txt 2>&1
          cat nele-live.txt

      - name: Post durable Nele Live transcript
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Nele Live — automatic transcript'
            echo
            echo '\`\`\`text'
            cat nele-live.txt
            echo '\`\`\`'
          } > nele-comment.md
          gh issue comment 60 --repo "$GITHUB_REPOSITORY" --body-file nele-comment.md

      - name: Fail if Nele Live failed
        if: steps.live_conversation.outcome == 'failure'
        run: exit 1

  chatgpt-live-nele:
    if: >-
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/nele-live')) ||
      (github.event_name == 'issues' && startsWith(github.event.issue.body, '/nele-live'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install requests
        run: pip install requests

      - name: Prepare requested conversation
        env:
          COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || github.event.issue.body }}
        run: |
          python - <<'PY'
          import json
          import os

          body = os.environ.get("COMMENT_BODY", "")
          lines = body.splitlines()
          questions = [
              line.strip()
              for line in lines[1:]
              if line.strip()
          ]
          if questions:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                  handle.write("NELE_LIVE_QUESTIONS_JSON=" + json.dumps(questions, ensure_ascii=False) + "\n")
          PY

      - name: Talk to production Nele
        id: conversation
        continue-on-error: true
        run: |
          python test_nele_live.py > nele-live.txt 2>&1
          cat nele-live.txt

      - name: Post conversation back to the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo '### Nele live conversation'
            echo
            echo '\`\`\`text'
            cat nele-live.txt
            echo '\`\`\`'
          } > nele-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file nele-comment.md

      - name: Fail if conversation failed
        if: steps.conversation.outcome == 'failure'
        run: exit 1

  e2e:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nele
          POSTGRES_PASSWORD: nele
          POSTGRES_DB: nele
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nele -d nele"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nele:nele@127.0.0.1:5432/nele
      CORS_ORIGINS: http://127.0.0.1:5500
      PORT: "5000"
      NELE_E2E_FRONTEND_URL: http://127.0.0.1:5500/nele.html
      NELE_E2E_BACKEND_URL: http://127.0.0.1:5000

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout production frontend
        uses: actions/checkout@v4
        with:
          repository: lernedeutsch/deutschsprechen
          path: frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install backend and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Start backend and frontend
        run: |
          gunicorn server.app:app > /tmp/nele-backend.log 2>&1 &
          python -m http.server 5500 --bind 127.0.0.1 --directory frontend > /tmp/nele-frontend.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nele-backend.log
          exit 1

      - name: Browser to backend to PostgreSQL E2E
        run: python tests/e2e_browser.py

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "===== backend ====="
          cat /tmp/nele-backend.log || true
          echo "===== frontend ====="
          cat /tmp/nele-frontend.log || true
